name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# aham-design 在独立仓库 Aham-AIAPP/aham-design。每个任务把它检出到 plugins/aham-design，
# 路径与拆分前一致，find_engine.py 按同级目录找到它。界面样式库的检查在 aham-design 仓库里跑
env:
  PPT_DIR: plugins/aham-design/skills/aham-ppt/assets/html2pptx

jobs:
  # 仓库脚本测试和公开检查。PPT 自查入口的测试要读 aham-design 的 PPT 引擎
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检出 aham-design
        uses: actions/checkout@v4
        with:
          repository: Aham-AIAPP/aham-design
          path: plugins/aham-design
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install python-docx lxml \
            -r plugins/aham-design/skills/aham-ppt/requirements.txt \
            -r plugins/aham-app/skills/aham-ppt-proposal/requirements.txt
      - name: 仓库脚本测试
        run: python -m unittest discover -s tests -v
      - name: 公开检查
        env:
          AHAM_PRIVATE_TERMS: ${{ secrets.AHAM_PRIVATE_TERMS }}
        run: |
          if [ -z "$AHAM_PRIVATE_TERMS" ]; then
            echo "::warning::没有读到仓库密钥 AHAM_PRIVATE_TERMS，本次只查内置词和企业名称规则"
          fi
          python scripts/check_public.py --history

  # PPT 引擎：用 demo 的五页示例跑 check_slides.js、导出 PPTX、跑 check_deck.py，再生成一次确认结果一致
  # Playwright 1.56.1 不支持 ubuntu 26.04，ubuntu-latest 换到 26.04 后装不上浏览器，这里固定 24.04
  ppt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 检出 aham-design
        uses: actions/checkout@v4
        with:
          repository: Aham-AIAPP/aham-design
          path: plugins/aham-design
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装依赖和 Chromium
        run: |
          pip install -r plugins/aham-design/skills/aham-ppt/requirements.txt \
            -r plugins/aham-app/skills/aham-ppt-proposal/requirements.txt
          cd "$PPT_DIR"
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node -e "console.log('pptxgenjs', require('pptxgenjs/package.json').version, 'playwright', require('playwright/package.json').version)"
      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: 生成样张并检查
        run: python scripts/build_ppt_samples.py "$RUNNER_TEMP/ppt/head" --check
      - name: 再生成一次，确认两次结果一致
        run: |
          python scripts/build_ppt_samples.py "$RUNNER_TEMP/ppt/head-again"
          python scripts/compare_outputs.py diff "$RUNNER_TEMP/ppt/head" "$RUNNER_TEMP/ppt/head-again" --limit 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppt-samples
          path: ${{ runner.temp }}/ppt/head/
          if-no-files-found: warn
          retention-days: 30
